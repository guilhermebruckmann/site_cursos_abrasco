<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_visualizacao" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="grid_visualizacao" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="560" height="280" fill="url(#grad_visualizacao)" />
  <rect width="560" height="280" fill="url(#grid_visualizacao)" />

  <!-- Visual element -->
  
            <rect x="300" y="80" width="240" height="150" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" />
            <circle cx="420" cy="155" r="50" fill="none" stroke="#38bdf8" stroke-width="24" stroke-dasharray="140 180" />
            <circle cx="420" cy="155" r="50" fill="none" stroke="#34d399" stroke-width="24" stroke-dasharray="70 250" stroke-dashoffset="-140" />
            <circle cx="420" cy="155" r="50" fill="none" stroke="#f59e0b" stroke-width="24" stroke-dasharray="90 230" stroke-dashoffset="-210" />
        

  <!-- Left Content -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="180" height="24" rx="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <text x="9" y="16" fill="#ffffff" font-size="10" font-weight="800" letter-spacing="1" font-family="Inter, system-ui, sans-serif">TRILHA FUNDAMENTAL</text>

    <text x="0" y="65" fill="#ffffff" font-size="22" font-weight="800" font-family="Inter, system-ui, sans-serif" width="250">
      Visualização de Dados
    </text>

    <text x="0" y="95" fill="rgba(255,255,255,0.85)" font-size="13" font-family="Inter, system-ui, sans-serif">
      Gráficos de Impacto na Vigilância
    </text>

    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="rgba(0,0,0,0.25)" />
      <circle cx="13" cy="13" r="5" fill="#34d399" />
      <text x="26" y="17" fill="#ffffff" font-size="11" font-weight="600" font-family="Inter, system-ui, sans-serif">Certificado UFSC</text>
    </g>
  </g>
</svg>