project:
  type: website
  output-dir: docs
  resources:
    - assets/images/

website:
  title: "Cursos de Vigilância em Saúde"
  description: "Cursos abertos e gratuitos de análise de dados para a vigilância em saúde no SUS"
  site-url: "https://guilhermebruckmann.github.io/site_cursos_abrasco"
  repo-url: "https://github.com/guilhermebruckmann/site_cursos_abrasco"
  repo-actions: [issue]
  favicon: "assets/images/favicon.svg"
  search: false
  
  navbar:
    background: primary
    logo: "assets/images/favicon.svg"
    search: false
    collapse-below: lg
    left:
      - text: "Início"
        href: index.qmd
      - text: "Catálogo de Cursos"
        menu:
          - text: "Todos os 10 Cursos"
            href: index.qmd#catalogo
          - text: "---"
          - text: "Novos Lançamentos"
          - text: "1. Desigualdades em Saúde"
            href: cursos/desigualdades.qmd
          - text: "2. Séries Temporais em Saúde"
            href: cursos/series-temporais.qmd
          - text: "3. Estatística Espacial Avançada"
            href: cursos/estatistica-espacial.qmd
          - text: "---"
          - text: "Trilha Fundamental"
          - text: "4. Curso Básico em R"
            href: cursos/curso-basico.qmd
          - text: "5. Visualização de Dados"
            href: cursos/visualizacao.qmd
          - text: "6. Relatórios Automatizados"
            href: cursos/relatorios.qmd
          - text: "---"
          - text: "Módulos Aplicados"
          - text: "7. Análise Espacial Básica"
            href: cursos/analise-espacial.qmd
          - text: "8. Construção de Dashboards"
            href: cursos/dashboards.qmd
          - text: "9. Linkage de Bases de Dados"
            href: cursos/linkage.qmd
          - text: "10. Diagramas de Controle"
            href: cursos/diagramas.qmd
      - text: "Sobre a Iniciativa"
        href: sobre.qmd
      - text: "Dúvidas Frequentes"
        href: faq.qmd
      - text: "Outros cursos da Abrasco"
        icon: box-arrow-up-right
        href: "https://abrasco.org.br/iniciativas/cursosvigilancia/"
        target: "_blank"
    right:
      - icon: github
        href: "https://github.com/guilhermebruckmann/site_cursos_abrasco"
        target: "_blank"

  page-footer:
    background: light
    left: |
      **Cursos Integrados de Vigilância em Saúde**<br>
      Parceria entre **UFSC**, **ABRASCO** e **ITpS** com apoio da **Fiocruz**, **UFPel** e **UNA-SUS**.
    right: |
      Cursos 100% gratuitos e autoinstrucionais para o SUS.<br>
      Construído com [Quarto](https://quarto.org).

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    css: styles.scss
    toc: true
    toc-title: "Nesta página"
    toc-depth: 3
    smooth-scroll: true
    lang: pt-BR
