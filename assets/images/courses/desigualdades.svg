<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_desigualdades" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <pattern id="grid_desigualdades" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="560" height="280" fill="url(#grad_desigualdades)" />
  <rect width="560" height="280" fill="url(#grid_desigualdades)" />

  <!-- Visual element -->
  
            <rect x="300" y="80" width="240" height="150" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" />
            <line x1="330" y1="200" x2="490" y2="110" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-dasharray="3,3" />
            <path d="M 330 200 Q 420 200 490 110" fill="rgba(52, 211, 153, 0.2)" stroke="#34d399" stroke-width="3" />
            <text x="340" y="115" fill="#a7f3d0" font-size="11" font-weight="bold">ÍNDICE DE GINI</text>
            <text x="340" y="130" fill="rgba(255,255,255,0.7)" font-size="9">Curva de Lorenz e Estratificação</text>
        

  <!-- Left Content -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="144" height="24" rx="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <text x="9" y="16" fill="#ffffff" font-size="10" font-weight="800" letter-spacing="1" font-family="Inter, system-ui, sans-serif">NOVO E EM ALTA</text>

    <text x="0" y="65" fill="#ffffff" font-size="22" font-weight="800" font-family="Inter, system-ui, sans-serif" width="250">
      Monitoramento de Desigualdades
    </text>

    <text x="0" y="95" fill="rgba(255,255,255,0.85)" font-size="13" font-family="Inter, system-ui, sans-serif">
      Equidade e Indicadores Sociais em Saúde
    </text>

    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="rgba(0,0,0,0.25)" />
      <circle cx="13" cy="13" r="5" fill="#34d399" />
      <text x="26" y="17" fill="#ffffff" font-size="11" font-weight="600" font-family="Inter, system-ui, sans-serif">Certificado UFSC</text>
    </g>
