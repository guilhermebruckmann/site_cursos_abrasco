            <path d="M 325 165 L 350 158 L 380 162 L 410 148 L 440 135 L 470 105 L 500 95" fill="none" stroke="#fbbf24" stroke-width="3" />
            <circle cx="470" cy="105" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
            <circle cx="500" cy="95" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
        

