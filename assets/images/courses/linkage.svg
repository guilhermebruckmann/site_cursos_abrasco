<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_linkage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <pattern id="grid_linkage" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="560" height="280" fill="url(#grad_linkage)" />
  <rect width="560" height="280" fill="url(#grid_linkage)" />

  <!-- Visual element -->
  
            <rect x="310" y="100" width="90" height="110" rx="6" fill="rgba(255,255,255,0.15)" stroke="#818cf8" stroke-width="1.5" />
            <text x="325" y="130" fill="#c7d2fe" font-size="11" font-weight="bold">SIM</text>
            <rect x="325" y="140" width="60" height="5" rx="2" fill="rgba(255,255,255,0.4)" />
            <rect x="325" y="150" width="50" height="5" rx="2" fill="rgba(255,255,255,0.4)" />
            <rect x="325" y="160" width="55" height="5" rx="2" fill="rgba(255,255,255,0.4)" />

            <rect x="440" y="100" width="90" height="110" rx="6" fill="rgba(255,255,255,0.15)" stroke="#818cf8" stroke-width="1.5" />
            <text x="455" y="130" fill="#c7d2fe" font-size="11" font-weight="bold">SINAN</text>
            <rect x="455" y="140" width="60" height="5" rx="2" fill="rgba(255,255,255,0.4)" />
            <rect x="455" y="150" width="50" height="5" rx="2" fill="rgba(255,255,255,0.4)" />
            <rect x="455" y="160" width="55" height="5" rx="2" fill="rgba(255,255,255,0.4)" />

            <path d="M 400 155 L 440 155" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4,3" />
            <circle cx="420" cy="155" r="12" fill="#6366f1" />
            <path d="M 416 155 L 424 155 M 420 151 L 420 159" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
        

  <!-- Left Content -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="144" height="24" rx="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <text x="9" y="16" fill="#ffffff" font-size="10" font-weight="800" letter-spacing="1" font-family="Inter, system-ui, sans-serif">ESPECIALIZAÇÃO</text>

    <text x="0" y="65" fill="#ffffff" font-size="22" font-weight="800" font-family="Inter, system-ui, sans-serif" width="250">
      Linkage de Bases em Saúde
    </text>

    <text x="0" y="95" fill="rgba(255,255,255,0.85)" font-size="13" font-family="Inter, system-ui, sans-serif">
      Integração SIM, SINAN e SINASC
    </text>

    <g transform="translate(0, 150)">
      <rect x="0" y="0" width="120" height="26" rx="13" fill="rgba(0,0,0,0.25)" />
      <circle cx="13" cy="13" r="5" fill="#34d399" />
      <text x="26" y="17" fill="#ffffff" font-size="11" font-weight="600" font-family="Inter, system-ui, sans-serif">Certificado UFSC</text>
    </g>
  </g>
</svg>