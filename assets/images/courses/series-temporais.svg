<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 280" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_series-temporais" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <pattern id="grid_series-temporais" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="560" height="280" fill="url(#grad_series-temporais)" />
  <rect width="560" height="280" fill="url(#grid_series-temporais)" />

  <!-- Visual element -->
  
            <rect x="300" y="80" width="240" height="150" rx="8" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" />
            <path d="M 320 170 Q 340 130 360 170 T 400 170 T 440 150 T 480 130 T 520 110" fill="none" stroke="#38bdf8" stroke-width="3" />
            <path d="M 320 180 L 520 130" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
            <text x="330" y="110" fill="#bae6fd" font-size="10" font-weight="bold">DECOMPOSIÇÃO &amp; PREVISÃO</text>
            <circle cx="440" cy="150" r="4" fill="#ffffff" />
            <circle cx="480" cy="130" r="4" fill="#ffffff" />
            <circle cx="520" cy="110" r="5" fill="#34d399" />
        

  <!-- Left Content -->
  <g transform="translate(30, 45)">
    <rect x="0" y="0" width="144" height="24" rx="4" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
    <text x="9" y="16" fill="#ffffff" font-size="10" font-weight="800" letter-spacing="1" font-family="Inter, system-ui, sans-serif">NOVO E EM ALTA</text>

    <text x="0" y="65" fill="#ffffff" font-size="22" font-weight="800" font-family="Inter, system-ui, sans-serif" width="250">
      Análises de Séries Temporais
    </text>

    <text x="0" y="95" fill="rgba(255,255,255,0.85)" font-size="13" font-family="Inter, system-ui, sans-serif">
